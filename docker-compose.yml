version: '3.8'
services:
  # Câu 81: Khai báo Service backend
  backend:
    build: ./mern-demo/server
    # Câu 83: Cấu hình Port cho Backend (5000)
    ports:
      - "5000:5000"
    # Câu 85: Cấu hình biến môi trường MongoDB
    environment:
      - MONGODB_URI=mongodb+srv://phanquocduy:duy235019@cluster0.bgjdza7.mongodb.net/cloud_lab?appName=Cluster0

  # Câu 82: Khai báo Service frontend
  frontend:
    build: ./mern-demo/client
    # Câu 84: Cấu hình Port cho Frontend (3000)
    ports:
      - "3000:3000"
    depends_on:
      - backend